<script>
// ===== road.js =====
function connectCities(a,b,type){
 if(a===b)return;
 if(S.links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a))){
  logEvent("이미 연결된 도시입니다.");
  return;
 }
 const A=S.cities[a],B=S.cities[b];
 const dx=(B.x-A.x),dy=(B.y-A.y);
 const distance=Math.sqrt(dx*dx+dy*dy);
 const cost=Math.round(distance*(type==="road"?55:125)*10);
 if(S.money<cost){
  logEvent(`${type==="road"?"도로":"철도"} 건설 자금이 부족합니다. 필요 ${cost.toLocaleString()}G`);
  return;
 }
 S.money-=cost;
 S.links.push({a,b,type,capacity:type==="road"?500:1800,used:0});
 logEvent(`${A.name} ↔ ${B.name} ${type==="road"?"도로":"철도"} 건설 완료 (-${cost.toLocaleString()}G)`);
 render();renderPanel();
}

</script>

<script>
// ===== transport.js =====

function connected(a,b){
 if(a===b)return true;
 const q=[a],seen=new Set([a]);
 while(q.length){
  const x=q.shift();
  for(const l of S.links){
   const n=l.a===x?l.b:l.b===x?l.a:null;
   if(n&&!seen.has(n)){if(n===b)return true;seen.add(n);q.push(n)}
  }
 }
 return false;
}
function route(a,b){
 const q=[[a]],seen=new Set([a]);
 while(q.length){
  const path=q.shift(),x=path[path.length-1];
  if(x===b)return path;
  for(const l of S.links){
   const n=l.a===x?l.b:l.b===x?l.a:null;
   if(n&&!seen.has(n)){seen.add(n);q.push([...path,n])}
  }
 }
 return null;
}
function tradeGood(from,to,good,amount){
 const A=S.cities[from],B=S.cities[to];
 if(from===to){logEvent("같은 도시끼리는 무역할 수 없습니다.");return}
 if(!route(from,to)){logEvent("두 도시가 도로 또는 철도로 연결되어 있지 않습니다.");return}
 if(A.goods[good]<amount){logEvent(`${A.name}에 ${GOODS[good].name} 재고가 부족합니다.`);return}
 const sellPrice=A.localPrices?.[good]||GOODS[good].base;
 const buyPrice=B.localPrices?.[good]||GOODS[good].base;
 const revenue=Math.round(amount*buyPrice);
 const cost=Math.round(amount*sellPrice);
 A.goods[good]-=amount;
 B.goods[good]+=amount;
 S.money+=Math.max(0,revenue-cost);
 S.tradeCount++;
 S.tradeStarted=true;
 logEvent(`${A.name} → ${B.name}: ${GOODS[good].name} ${amount}개 무역, 차익 +${Math.max(0,revenue-cost).toLocaleString()}G`);
 render();renderPanel();
}
function middleTrade(good,amount){
 const hub=S.selected,ids=Object.keys(S.cities);
 let source=null,dest=null;
 for(const a of ids)for(const b of ids){
  if(a!==hub&&b!==hub&&a!==b&&S.cities[a].goods[good]>=amount&&route(a,hub)&&route(hub,b)){
   const buy=S.cities[a].localPrices?.[good]||GOODS[good].base;
   const sell=S.cities[b].localPrices?.[good]||GOODS[good].base;
   if(sell>buy*1.15){source=a;dest=b;break}
  }
  if(source)break;
 }
 if(!source){logEvent("현재 중계무역으로 수익을 낼 수 있는 노선이 없습니다.");return}
 const A=S.cities[source],B=S.cities[dest],buy=A.localPrices[good],sell=B.localPrices[good];
 A.goods[good]-=amount; S.money+=Math.round((sell-buy)*amount);
 S.tradeStarted=true;S.tradeCount++;
 logEvent(`${A.name} → ${S.cities[hub].name} → ${B.name}: ${GOODS[good].name} ${amount}개 중계무역, 이익 +${Math.round((sell-buy)*amount).toLocaleString()}G`);
}

</script>
<script>

function cityBuildings(c){return c.buildings.filter(b=>b.done)}
function laborPool(c){return Math.floor(c.population*.55)}
function rebuildWorkers(c){
 let available=laborPool(c);c.workers=0;
 for(const b of cityBuildings(c)){
  const need=BUILDINGS[b.type].workers||0;
  b.workers=Math.min(need,available); available-=b.workers; c.workers+=b.workers;
 }
 c.unemployed=Math.max(0,available);
}
function researchBonus(b){
 const d=BUILDINGS[b.type];
 let x=1;
 if(researched.has("agri") && /농장|과수원|축산|낙농|벌목/.test(d.name)) x*=1.15;
 if(researched.has("industry") && /공장/.test(d.name)) x*=1.12;
 if(researched.has("electronics") && /전자|가전/.test(d.name)) x*=1.20;
 return x;
}
function produce(){
 for(const c of Object.values(S.cities)){
  rebuildWorkers(c);
  for(const b of cityBuildings(c)){
   const d=BUILDINGS[b.type],w=b.workers;
   if(!d.prod||w<=0) continue;
   let ratio=1;
   for(const [g,n] of Object.entries(d.input||{}))
     ratio=Math.min(ratio,c.goods[g]/Math.max(.001,n*w));
   ratio=Math.max(0,Math.min(1,ratio));
   for(const [g,n] of Object.entries(d.input||{})) c.goods[g]-=n*w*ratio;
   const bonus=researchBonus(b);
   for(const [g,n] of Object.entries(d.prod)) c.goods[g]+=n*w*ratio*bonus;
  }
 }
}
function aiTrade(){

 for(const a of ids){
  if(a==="central") continue;
  for(const b of ids){
   if(a===b||b==="central"||!connected(a,b)) continue;
   const A=S.cities[a],B=S.cities[b];
   for(const g of ["rice","wheat","steel","wood","coal","ironOre","bread","clothes","machine","phone"]){
    const pa=A.localPrices?.[g]||GOODS[g].base, pb=B.localPrices?.[g]||GOODS[g].base;
    if(A.goods[g]>150 && pb>pa*1.25){
      const amount=Math.min(40,Math.floor(A.goods[g]-100));
      A.goods[g]-=amount; B.goods[g]+=amount;
      break;
    }
   }
  }
 }
}
function monthlyEconomy(){
 for(const c of Object.values(S.cities)){
  rebuildWorkers(c);
  const wage=c.workers*120;
  if(S.money>=wage){S.money-=wage;c.wageDebt=0;c.unrest=Math.max(0,c.unrest-2)}
  else{c.wageDebt++;c.unrest+=4;if(c.wageDebt>=3){c.workers=Math.max(0,c.workers-Math.ceil(c.workers*.05));logEvent(`${c.name}: 임금 체불로 노동자 이탈`)}}
  const foodNeed=c.population*.25;
  let available=0;
  for(const g of ECON.food) available+=c.goods[g]||0;
  if(available<foodNeed)c.foodShort++;
  else c.foodShort=0;
  if(c.foodShort>=2){
    const death=Math.ceil(c.population*(.004*c.foodShort));
    c.population=Math.max(100,c.population-death);
    logEvent(`${c.name}: 장기 식량 부족으로 ${death}명 감소`);
  }
  if(c.unemployed/Math.max(1,laborPool(c))>.25){c.stability-=2;c.unrest+=3}
  if(c.unrest>30&&Math.random()<.3){c.stability-=10;logEvent(`${c.name}: 노동 불만으로 시위 발생`)}
  c.maxPop=c.population+c.buildings.filter(b=>b.done&&b.type==="house").length*600+1200;
  if(c.population<c.maxPop&&c.foodShort===0&&c.stability>55)c.population+=Math.max(1,Math.floor(c.population*.002));
  c.stability=Math.max(0,Math.min(100,c.stability)); c.unrest=Math.max(0,c.unrest);
 }
 consumeGoods();
 updatePrices();
 autoTrade();
 randomEvent();
}

</script>

<script>
// ===== economy.js =====

const ECON={
  food:["rice","wheat","corn","potato","vegetable","fruit","meat","milk","bread","canned","frozen","drink"],
  dailyNeed:{rice:.03,wheat:.025,corn:.02,potato:.02,vegetable:.025,fruit:.012,meat:.01,milk:.012,bread:.018,canned:.008,frozen:.006,drink:.01},
  consumer:["bread","canned","frozen","drink","furniture","clothes","tools","phone","computer","tv","fridge","washer","aircon","car"],
  industrial:["steel","chemicals","machine","wood","coal","ironOre","oil"]
};
function initPrices(){
  for(const [k,g] of Object.entries(GOODS)) S.prices[k]=g.base;
}
function demandScore(c,g){
  const base=ECON.dailyNeed[g]||0;
  if(base) return c.population*base*30;
  if(ECON.consumer.includes(g)) return c.population*(g==="car"?0.002:0.01);
  return 10;
}
function updatePrices(){
  for(const [id,c] of Object.entries(S.cities)){
    c.demand={};
    for(const g of Object.keys(GOODS)){
      const demand=demandScore(c,g);
      const stock=c.goods[g];
      c.demand[g]=demand;
      let target=GOODS[g].base;
      if(demand>0){
        const ratio=stock/(demand+1);
        target*=Math.max(.55,Math.min(2.4,1.35-ratio));
      }
      if(c.port) target*=1.12;
      c.localPrices=c.localPrices||{};
      c.localPrices[g]=Math.max(1,target);
    }
  }
  for(const g of Object.keys(GOODS)){
    const vals=Object.values(S.cities).map(c=>c.localPrices[g]);
    S.prices[g]=vals.reduce((a,b)=>a+b,0)/vals.length;
  }
}
function consumeGoods(){
  for(const c of Object.values(S.cities)){
    let foodNeed=c.population*.25;
    const priority=["rice","wheat","corn","potato","vegetable","fruit","meat","milk","bread","canned","frozen","drink"];
    for(const g of priority){
      const take=Math.min(c.goods[g],foodNeed);
      c.goods[g]-=take; foodNeed-=take;
      if(foodNeed<=0) break;
    }
    if(foodNeed>0){
      c.foodShort++;
      c.stability-=Math.min(12,foodNeed/Math.max(1,c.population)*100);
    } else c.foodShort=0;
  }
}
function sellToCity(from,to,g,amount){
  const A=S.cities[from],B=S.cities[to];
  if(!connected(from,to)||A.goods[g]<amount) return false;
  const buy=B.localPrices?.[g]||GOODS[g].base;
  const sell=(A.localPrices?.[g]||GOODS[g].base)*.78;
  if(buy<=sell) return false;
  A.goods[g]-=amount; B.goods[g]+=amount;
  S.money+=Math.round((buy-sell)*amount);
  S.tradeCount++; S.tradeStarted=true;
  logEvent(`${A.name} → ${B.name}: ${GOODS[g].name} ${amount}개 중개무역, 차익 +${Math.round((buy-sell)*amount).toLocaleString()}G`);
  return true;
}
function autoTrade(){
  if(!S.tradeStarted) return;
  const ids=Object.keys(S.cities);
  for(const g of ECON.consumer.concat(["steel","machine","chemicals"])){
    for(const a of ids) for(const b of ids){
      if(a===b||!connected(a,b)) continue;
      const A=S.cities[a],B=S.cities[b];
      const pa=A.localPrices?.[g]||GOODS[g].base, pb=B.localPrices?.[g]||GOODS[g].base;
      if(A.goods[g]>100 && pb>pa*1.18){ sellToCity(a,b,g,Math.min(50,Math.floor(A.goods[g]-100))); break; }
    }
  }
}

</script>
<script>
// ===== gameLoop.js =====

function tickConstruction(){
 for(const c of Object.values(S.cities))for(const b of c.buildings)if(!b.done){
  b.remaining--;
  if(b.remaining<=0){b.done=true;b.remaining=0;logEvent(`${c.name}: ${BUILDINGS[b.type].name} 완공`)}
 }
}
function randomEvent(){
 if(!S.tradeStarted||Math.random()>.25)return;
 const c=Object.values(S.cities)[Math.floor(Math.random()*Object.keys(S.cities).length)],r=Math.random();
 if(r<.12){c.stability-=12;c.unrest+=10;logEvent(`${c.name}: 대규모 시위 발생`)}
 else if(r<.24){c.localPrices=c.localPrices||{};for(const g of ECON.food)c.localPrices[g]=(c.localPrices[g]||GOODS[g].base)*1.35;logEvent(`${c.name}: 식품 가격 급등`)}
 else if(r<.36){for(const g of ["wheat","rice","corn"])c.goods[g]*=.7;logEvent(`${c.name}: 흉작 발생`)}
 else if(r<.48){c.stability=Math.min(100,c.stability+12);logEvent(`${c.name}: 경기 호황`)}
 else if(r<.60){c.goods.ironOre+=300;logEvent(`${c.name}: 철광석 광맥 발견`)}
 else if(r<.72){c.unrest+=8;logEvent(`${c.name}: 항만·운송 파업`)}
 else if(r<.84){const fs=c.buildings.filter(b=>b.done&&BUILDINGS[b.type].prod);if(fs.length){fs[Math.floor(Math.random()*fs.length)].done=false;logEvent(`${c.name}: 공장 화재로 생산시설 일시 중단`)}}
 else{for(const g of ECON.consumer)c.localPrices[g]=(c.localPrices?.[g]||GOODS[g].base)*1.25;logEvent(`${c.name}: 소비 붐 — 소비재 가격 상승`)}
}
function nextDay(){
 S.day++;tickConstruction();produce();updatePrices();
 if(S.day>30){S.day=1;S.month++;monthlyEconomy();if(S.month>12){S.month=1;S.year++}}
 render();renderPanel();
}
function startLoop(){}
function skipDay(){nextDay()}

</script>

// ===== Supabase automatic cloud save/load =====
let saveUserId = null;
let saveReady = false;
let saveTimer = null;
let saveQueue = Promise.resolve();
let saveIntervalStarted = false;

function collectSaveData() {
  return {
    version: 1,
    state: JSON.parse(JSON.stringify(S)),
    researched: [...researched]
  };
}

function restoreSaveData(data) {
  if (!data || data.version !== 1 || !data.state || !data.state.cities) {
    throw new Error("저장 데이터 형식이 올바르지 않습니다.");
  }
  const state = data.state;
  if (!state.cities.central || !Array.isArray(state.links) || !Array.isArray(state.construction) || !state.prices) {
    throw new Error("저장된 도시 데이터가 손상되었습니다.");
  }
  Object.assign(S, state);
  researched.clear();
  for (const id of (data.researched || [])) {
    if (RESEARCH.some(item => item.id === id)) researched.add(id);
  }
  for (const city of Object.values(S.cities)) {
    city.goods = { ...blankGoods(), ...(city.goods || {}) };
    city.localPrices = city.localPrices || {};
    city.buildings = city.buildings || [];
  }
}

async function saveGameNow() {
  if (!saveReady || !saveUserId) return;
  const { error } = await sb.from("game_saves").upsert({
    user_id: saveUserId,
    save_data: collectSaveData(),
    updated_at: new Date().toISOString()
  }, { onConflict: "user_id" });
  if (error) throw error;
  console.log("Mini Transport City: 클라우드 저장 완료");
}

function requestGameSave() {
  if (!saveReady || !saveUserId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveQueue = saveQueue.catch(() => {}).then(saveGameNow).catch(error => {
      console.error("클라우드 저장 실패:", error);
      showSaveNotice("클라우드 저장 실패 — 인터넷과 Supabase 설정을 확인하세요.");
    });
  }, 700);
}

function showSaveNotice(message) {
  let el = document.getElementById("cloudSaveNotice");
  if (!el) {
    el = document.createElement("div");
    el.id = "cloudSaveNotice";
    el.style.cssText = "position:fixed;bottom:10px;right:10px;z-index:2000;background:#17212c;color:#fff;padding:8px 12px;border:1px solid #52627a;border-radius:7px;font-size:12px;max-width:90vw";
    document.body.appendChild(el);
  }
  el.textContent = message;
  if (message.includes("완료")) setTimeout(() => el.remove(), 2500);
}

async function loadGameFromSupabase() {
  const { data: sessionData, error: sessionError } = await sb.auth.getSession();
  if (sessionError) throw sessionError;
  let session = sessionData.session;
  if (!session) {
    const { data, error } = await sb.auth.signInAnonymously();
    if (error) throw error;
    session = data.session;
  }
  if (!session) throw new Error("익명 로그인 세션을 만들지 못했습니다.");
  saveUserId = session.user.id;

  const { data: saved, error } = await sb.from("game_saves")
    .select("save_data").eq("user_id", saveUserId).maybeSingle();
  if (error) throw error;

  if (saved && saved.save_data) {
    restoreSaveData(saved.save_data);
    render();
    renderPanel();
    showSaveNotice("이전 게임을 불러왔습니다.");
  } else {
    init();
    showSaveNotice("새 게임을 시작했습니다. 자동 저장이 켜졌습니다.");
  }

  saveReady = true;
  requestGameSave();
  if (!saveIntervalStarted) {
    saveIntervalStarted = true;
    setInterval(requestGameSave, 15000);
  }
}

function installAutoSaveHooks() {
  const hook = (name) => {
    const original = window[name];
    if (typeof original !== "function") return;
    window[name] = function (...args) {
      const result = original.apply(this, args);
      requestGameSave();
      return result;
    };
  };
  ["nextDay", "startBuild", "connectCities", "research", "tradeGood", "middleTrade", "buildTransport"].forEach(hook);
}

async function startGameWithCloudSave() {
  installAutoSaveHooks();
  try {
    await loadGameFromSupabase();
  } catch (error) {
    saveReady = false;
    console.error("클라우드 저장/불러오기 실패:", error);
    const message = `클라우드 저장에 연결하지 못했습니다.
Supabase에서 Anonymous Sign-Ins를 켰는지, game_saves 테이블과 RLS 정책을 만들었는지 확인하세요.
기존 저장 데이터를 보호하기 위해 새 게임은 자동으로 시작하지 않았습니다.`;
    alert(message);
  }
}

// Best-effort final save when leaving or refreshing the page.
window.addEventListener("pagehide", () => {
  if (saveReady && saveUserId) {
    clearTimeout(saveTimer);
    saveQueue = saveQueue.catch(() => {}).then(saveGameNow).catch(error => console.error("마지막 저장 실패:", error));
  }
});

startGameWithCloudSave();

</script>
